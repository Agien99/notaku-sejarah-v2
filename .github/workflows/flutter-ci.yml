name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.5"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate platform scaffolding
        run: flutter create . --empty --platforms=android,web --org com.digitechgien --project-name notaku_sejarah_v2

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          dart format lib test
          git diff -- lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: notaku-sejarah-v2-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: flutter create . --empty --platforms=android --org com.digitechgien --project-name notaku_sejarah_v2

      - name: Configure Android identity
        run: |
          sed -i 's/applicationId = "com.digitechgien.notaku_sejarah_v2"/applicationId = "com.digitechgien.notakusejarah"/' android/app/build.gradle.kts
          sed -i 's/android:label="notaku_sejarah_v2"/android:label="Notaku Sejarah"/' android/app/src/main/AndroidManifest.xml
          grep -F 'applicationId = "com.digitechgien.notakusejarah"' android/app/build.gradle.kts
          grep -F 'android:label="Notaku Sejarah"' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare APK artifact
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk build/artifacts/notaku-sejarah-v2-debug.apk
          sha256sum build/artifacts/notaku-sejarah-v2-debug.apk | tee build/artifacts/notaku-sejarah-v2-debug.sha256

      - name: Verify APK identity
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/artifacts/notaku-sejarah-v2-debug.apk | tee build/artifacts/apk-badging.txt
          grep -F "package: name='com.digitechgien.notakusejarah'" build/artifacts/apk-badging.txt
          grep -F "application-label:'Notaku Sejarah'" build/artifacts/apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notaku-sejarah-v2-debug-apk
          path: |
            build/artifacts/notaku-sejarah-v2-debug.apk
            build/artifacts/notaku-sejarah-v2-debug.sha256
            build/artifacts/apk-badging.txt
          if-no-files-found: error
          retention-days: 14

  web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Web scaffolding
        run: flutter create . --empty --platforms=web --org com.digitechgien --project-name notaku_sejarah_v2

      - name: Configure web preview
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          index_path = Path("web/index.html")
          index = index_path.read_text()

          index = re.sub(
              r'<meta name="description" content="[^"]*">',
              '<meta name="description" content="Aplikasi pembelajaran Sejarah yang moden dan responsif.">',
              index,
          )
          index = re.sub(
              r'<meta name="apple-mobile-web-app-title" content="[^"]*">',
              '<meta name="apple-mobile-web-app-title" content="Notaku Sejarah">',
              index,
          )
          index = re.sub(
              r'<title>.*?</title>',
              '<title>Notaku Sejarah</title>',
              index,
          )

          if 'name="theme-color"' not in index:
              index = index.replace(
                  '<title>Notaku Sejarah</title>',
                  '<meta name="theme-color" content="#102A43">\n  <title>Notaku Sejarah</title>',
              )

          index_path.write_text(index)

          manifest_path = Path("web/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest.update(
              {
                  "name": "Notaku Sejarah",
                  "short_name": "Notaku Sejarah",
                  "description": "Aplikasi pembelajaran Sejarah yang moden dan responsif.",
                  "background_color": "#F7F1E3",
                  "theme_color": "#102A43",
                  "orientation": "any",
              }
          )
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          )
          PY

          grep -F '<title>Notaku Sejarah</title>' web/index.html
          grep -F '"orientation": "any"' web/manifest.json

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/notaku-sejarah-v2/" --pwa-strategy=none

      - name: Verify web build
        run: |
          grep -F '<base href="/notaku-sejarah-v2/">' build/web/index.html
          grep -F '<title>Notaku Sejarah</title>' build/web/index.html
          grep -F '"orientation": "any"' build/web/manifest.json
          test -s build/web/main.dart.js
          printf '%s\n' "$GITHUB_SHA" > build/web/build-info.txt

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: notaku-sejarah-v2-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live web preview
        run: |
          PREVIEW_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking ${PREVIEW_URL}"

          for attempt in 1 2 3 4 5 6; do
            DEPLOYED_SHA="$(curl -fsSL "${PREVIEW_URL}build-info.txt?sha=${GITHUB_SHA}" || true)"

            if [ "${DEPLOYED_SHA}" = "${GITHUB_SHA}" ]; then
              echo "Live preview matches commit ${GITHUB_SHA}"
              break
            fi

            if [ "${attempt}" -eq 6 ]; then
              echo "Expected commit ${GITHUB_SHA}, received ${DEPLOYED_SHA}"
              exit 1
            fi

            sleep 5
          done

          curl -fsSL "${PREVIEW_URL}?sha=${GITHUB_SHA}" -o /tmp/notaku-index.html
          grep -F '<title>Notaku Sejarah</title>' /tmp/notaku-index.html
